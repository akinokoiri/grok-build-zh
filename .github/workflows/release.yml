name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.1.0-zh.4)"
        required: true
        default: "v0.1.0-zh.4"
      ref:
        description: "Git ref to build from (branch/SHA; default current)"
        required: false
        default: "zh-CN"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: grok-zh-x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
            name: grok-zh-aarch64-apple-darwin
          # Intel macOS — use macos-13 Intel runners when available
          - os: macos-13
            target: x86_64-apple-darwin
            name: grok-zh-x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: grok-zh-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: grok-zh-aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.ref || 'zh-CN') || github.ref }}

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install Rust ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Install DotSlash
        run: cargo install dotslash --locked || cargo install dotslash

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler build-essential cmake
          protoc --version
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: System deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf pkg-config || true
          if command -v protoc >/dev/null 2>&1; then
            echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"
            protoc --version
          else
            echo "WARN: protoc not found on PATH"
          fi

      - name: System deps (Windows)
        if: runner.os == 'Windows'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          if command -v protoc >/dev/null 2>&1; then
            export PROTOC="$(which protoc)"
            echo "PROTOC=$PROTOC"
          fi
          rustc -vV
          cargo build -p xai-grok-pager-bin --release --target "${{ matrix.target }}"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/xai-grok-pager.exe"
          if [[ ! -f "$BIN" ]]; then
            BIN="target/release/xai-grok-pager.exe"
          fi
          test -f "$BIN"
          STAGE="dist/${{ matrix.name }}"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/grok-zh.exe"
          cp README.md LICENSE install.ps1 "$STAGE/" 2>/dev/null || true
          [[ -f NOTICE ]] && cp NOTICE "$STAGE/" || true
          [[ -f ZH_VERSION ]] && cp ZH_VERSION "$STAGE/" || true
          if [[ -d docs/zh/bundled-zh ]]; then
            mkdir -p "$STAGE/bundled-zh"
            cp -r docs/zh/bundled-zh/* "$STAGE/bundled-zh/" 2>/dev/null || true
          fi
          {
            echo "Grok Build Chinese UI build (community, unofficial)"
            echo "Binary: grok-zh.exe"
            echo "Platform: ${{ matrix.name }}"
            echo ""
            echo "One-line install (PowerShell):"
            echo "  irm https://raw.githubusercontent.com/${{ github.repository }}/zh-CN/install.ps1 | iex"
            echo ""
            echo "Manual:"
            echo "  Move grok-zh.exe to %USERPROFILE%\.grok\bin\grok-zh.exe"
            echo "  Ensure %USERPROFILE%\.grok\bin is in PATH"
            echo "  Run: grok-zh"
            echo ""
            echo "Repo: https://github.com/${{ github.repository }}"
            echo "Upstream: https://github.com/xai-org/grok-build"
          } > "$STAGE/README-BINARY.txt"
          (cd dist && 7z a -tzip "../${{ matrix.name }}.zip" "${{ matrix.name }}")
          ls -lh "${{ matrix.name }}.zip"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.name }}.zip" | tee "${{ matrix.name }}.zip.sha256"
          else
            sha256sum "${{ matrix.name }}.zip" | tee "${{ matrix.name }}.zip.sha256"
          fi

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/xai-grok-pager"
          if [[ ! -f "$BIN" ]]; then
            BIN="target/release/xai-grok-pager"
          fi
          test -f "$BIN"
          # strip if available (smaller download)
          if command -v strip >/dev/null 2>&1; then
            strip "$BIN" || true
          fi
          STAGE="dist/${{ matrix.name }}"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/grok-zh"
          chmod +x "$STAGE/grok-zh"
          cp README.md LICENSE install.sh "$STAGE/" 2>/dev/null || true
          [[ -f NOTICE ]] && cp NOTICE "$STAGE/" || true
          [[ -f ZH_VERSION ]] && cp ZH_VERSION "$STAGE/" || true
          {
            echo "Grok Build Chinese UI build (community, unofficial)"
            echo "Binary: grok-zh"
            echo "Platform: ${{ matrix.name }}"
            echo ""
            echo "One-line install:"
            echo "  curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/zh-CN/install.sh | bash"
            echo ""
            echo "Manual:"
            echo "  chmod +x grok-zh && mkdir -p ~/.local/bin && mv grok-zh ~/.local/bin/"
            echo "  export PATH=\"\$HOME/.local/bin:\$PATH\""
            echo "  grok-zh"
            echo ""
            echo "Repo: https://github.com/${{ github.repository }}"
            echo "Upstream: https://github.com/xai-org/grok-build"
          } > "$STAGE/README-BINARY.txt"
          tar -C dist -czf "${{ matrix.name }}.tar.gz" "${{ matrix.name }}"
          ls -lh "${{ matrix.name }}.tar.gz"
          # checksum
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.name }}.tar.gz" | tee "${{ matrix.name }}.tar.gz.sha256"
          else
            sha256sum "${{ matrix.name }}.tar.gz" | tee "${{ matrix.name }}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Publish even if some platforms failed — attach whatever succeeded
    if: always() && needs.build.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.ref || 'zh-CN') || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          count=0
          while IFS= read -r -d '' f; do
            cp "$f" release-assets/
            count=$((count + 1))
            echo "asset: $(basename "$f") ($(du -h "$f" | cut -f1))"
          done < <(find artifacts -type f \( -name 'grok-zh-*.tar.gz' -o -name 'grok-zh-*.zip' -o -name 'grok-zh-*.sha256' \) -print0 2>/dev/null || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          ls -la release-assets || true
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No release assets found — all build matrix jobs failed"
            exit 1
          fi

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure tag exists (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          REF="${{ github.event.inputs.ref || 'zh-CN' }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally"
          else
            git fetch origin "$REF" --depth=1
            git tag -f "$TAG" "origin/$REF" 2>/dev/null || git tag -f "$TAG" HEAD
            git push origin "refs/tags/$TAG" --force
          fi

      - name: Create / update GitHub Release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOF
          ## 社区汉化构建（非官方 · 支持 Windows 11 / macOS / Linux）

          基于 [xai-org/grok-build](https://github.com/xai-org/grok-build)。**与 SpaceXAI / xAI 无官方隶属关系。**

          ### Windows 11 一键安装（PowerShell）

          \`\`\`powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/zh-CN/install.ps1 | iex
          \`\`\`

          ### Linux / macOS 一键安装

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/zh-CN/install.sh | bash
          \`\`\`

          安装完成后执行：\`grok-zh\`

          ### 手动安装（下载附件）

          | 平台 | 资产包 | 说明 |
          |------|--------|------|
          | **Windows x64** | \`grok-zh-x86_64-pc-windows-msvc.zip\` | 解压将 \`grok-zh.exe\` 放入 \`~/.grok/bin/\` |
          | macOS Apple Silicon | \`grok-zh-aarch64-apple-darwin.tar.gz\` | 解压将 \`grok-zh\` 放入 \`~/.local/bin/\` |
          | macOS Intel | \`grok-zh-x86_64-apple-darwin.tar.gz\` | 解压将 \`grok-zh\` 放入 \`~/.local/bin/\` |
          | Linux x64 | \`grok-zh-x86_64-unknown-linux-gnu.tar.gz\` | 解压将 \`grok-zh\` 放入 \`~/.local/bin/\` |
          | Linux ARM64 | \`grok-zh-aarch64-unknown-linux-gnu.tar.gz\` | 解压将 \`grok-zh\` 放入 \`~/.local/bin/\` |

          官方英文原版请使用：\`curl -fsSL https://x.ai/cli/install.sh | bash\`
          EOF
          )"
          # strip leading spaces from heredoc indent
          NOTES="$(printf '%s\n' "$NOTES" | sed 's/^          //')"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating notes & assets"
            gh release edit "$TAG" --title "Grok Build 汉化版 ${TAG}" --prerelease --notes "$NOTES" || true
          else
            gh release create "$TAG" \
              --title "Grok Build 汉化版 ${TAG}" \
              --prerelease \
              --notes "$NOTES"
          fi

          # --clobber so re-runs / pre-seeded assets can be replaced
          gh release upload "$TAG" release-assets/* --clobber
          gh release view "$TAG"
