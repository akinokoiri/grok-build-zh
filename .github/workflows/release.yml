name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0-zh.1)"
        required: true
        default: "v0.1.0-zh.1"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: grok-zh-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            name: grok-zh-x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: grok-zh-x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (repo pin if present)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install DotSlash
        run: cargo install dotslash --locked

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      - name: Build release binary
        run: cargo build -p xai-grok-pager-bin --release --target ${{ matrix.target }}
        env:
          CARGO_TERM_COLOR: always

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/xai-grok-pager"
          if [[ ! -f "$BIN" ]]; then
            BIN="target/release/xai-grok-pager"
          fi
          test -x "$BIN" || test -f "$BIN"
          STAGE="dist/${{ matrix.name }}"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/grok-zh"
          chmod +x "$STAGE/grok-zh"
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true
          [[ -f NOTICE ]] && cp NOTICE "$STAGE/" || true
          [[ -f ZH_VERSION ]] && cp ZH_VERSION "$STAGE/" || true
          cat > "$STAGE/README-BINARY.txt" << EOT
Grok Build 汉化版（社区非官方构建）
================================
二进制: grok-zh
安装:
  chmod +x grok-zh
  mkdir -p ~/.local/bin && mv grok-zh ~/.local/bin/
  grok-zh

仓库: https://github.com/ivan6232/grok-build-zh
上游: https://github.com/xai-org/grok-build
EOT
          tar -C dist -czf "${{ matrix.name }}.tar.gz" "${{ matrix.name }}"
          ls -lh "${{ matrix.name }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Grok Build 汉化版 ${{ steps.tag.outputs.name }}
          prerelease: true
          generate_release_notes: true
          body: |
            ## 社区汉化版 · 非官方

            基于 [xai-org/grok-build](https://github.com/xai-org/grok-build) 的简体中文 UI 构建。

            **与 SpaceXAI / xAI 无官方关系。** 请遵守 xAI 服务条款。

            ### 安装
            ```bash
            tar -xzf grok-zh-*.tar.gz
            chmod +x */grok-zh
            mkdir -p ~/.local/bin && mv */grok-zh ~/.local/bin/
            grok-zh
            ```
          files: artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
