name: CI

on:
  push:
    branches: [zh-CN, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install DotSlash
        run: cargo install dotslash --locked || true
      - name: cargo check
        run: cargo check -p xai-grok-pager-bin
        continue-on-error: true
