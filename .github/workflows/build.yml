name: Build

on:
  push:
    branches: [zh-CN, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install dotslash
        run: cargo install dotslash || true
      - name: Cargo check (pager bin)
        run: cargo check -p xai-grok-pager-bin
        continue-on-error: true
