name: Verify Windows x64

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "crates/codegen/xai-grok-shared/i18n/**"
      - "scripts/audit-translations.ps1"
      - ".github/workflows/release-windows.yml"
      - ".github/workflows/sync-upstream.yml"
      - ".github/workflows/translations.yml"
  push:
    branches: [zh-CN, main]
    paths-ignore:
      - "**/*.md"
      - "crates/codegen/xai-grok-shared/i18n/**"
      - "scripts/audit-translations.ps1"
      - ".github/workflows/release-windows.yml"
      - ".github/workflows/sync-upstream.yml"
      - ".github/workflows/translations.yml"

permissions:
  contents: read

concurrency:
  group: verify-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt
      # v0.0.11, pinned so the executable action cannot change underneath us.
      - uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c
        with:
          version: "v0.17.0"
      # Keep Cargo downloads, but let sccache own compiler outputs. Caching both
      # target/ and sccache objects wastes space and makes post-job uploads slow.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: windows-x64-verify
          cache-targets: false
          cache-on-failure: true
      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Translation audit
        shell: pwsh
        run: ./scripts/audit-translations.ps1
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Translation loader tests
        run: cargo test -p xai-grok-shared i18n --lib
      - name: Windows protobuf regression tests
        run: cargo test -p xai-proto-build dependency_tests --lib
      - name: Compile Windows application
        run: cargo check -p xai-grok-pager-bin
