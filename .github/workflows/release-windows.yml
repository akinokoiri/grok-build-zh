name: Release Windows x64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 0.2.106-zh.1）"
        required: true
        type: string
      ref:
        description: "要构建的分支或提交"
        required: true
        default: "zh-CN"
        type: string
      notes:
        description: "可选发行说明"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-x64
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  TARGET: x86_64-pc-windows-msvc
  ASSET: grok-zh-x86_64-pc-windows-msvc.zip
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_NOTES: ${{ inputs.notes }}

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+-zh\.\d+$') {
            throw 'Version must look like 0.2.106-zh.1'
          }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Reject an existing release version
        shell: pwsh
        run: |
          $Tag = "v$env:RELEASE_VERSION"
          $ExistingTag = git ls-remote --tags origin "refs/tags/$Tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect remote tags' }
          if ($ExistingTag) { throw "Release tag $Tag already exists; choose a new version" }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.94.0"
          components: rustfmt
          targets: x86_64-pc-windows-msvc
      # v0.0.11, pinned so the executable action cannot change underneath us.
      - uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c
        with:
          version: "v0.17.0"
      # Keep Cargo downloads, but let sccache own compiler outputs. Caching both
      # target/ and sccache objects wastes space and makes post-job uploads slow.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: windows-x64-release
          cache-targets: false
          cache-on-failure: true
      - uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Static release gates
        shell: pwsh
        run: |
          ./scripts/audit-translations.ps1
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting gate failed' }
          ./scripts/test-installer.ps1
      - name: Build Windows x64
        shell: pwsh
        env:
          GROK_VERSION: ${{ inputs.version }}
        run: cargo build -p xai-grok-pager-bin --release --features release-dist --target $env:TARGET
      # Build the broad release-dist graph first. The narrower test binaries can
      # then reuse its release dependencies instead of warming a mismatched
      # feature graph before the final build.
      - name: Release tests
        shell: pwsh
        run: |
          cargo test -p xai-grok-shared i18n --lib --release --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Translation tests failed' }
          cargo test -p xai-proto-build dependency_tests --lib --release --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Windows protobuf tests failed' }
      - name: Smoke test and package
        shell: pwsh
        run: |
          $Binary = "target/$env:TARGET/release/xai-grok-pager.exe"
          if (-not (Test-Path -LiteralPath $Binary)) { throw "Missing $Binary" }
          $VersionOutput = & $Binary version | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Version smoke test failed: $LASTEXITCODE" }
          $ExpectedVersionPattern = '(?:^|\s)' + [regex]::Escape($env:RELEASE_VERSION) + '(?:\s|$)'
          if ($VersionOutput -notmatch $ExpectedVersionPattern) {
            throw "Smoke test returned unexpected version: $VersionOutput"
          }
          $Stage = "dist/package"
          New-Item -ItemType Directory -Path $Stage -Force | Out-Null
          Copy-Item -LiteralPath $Binary -Destination "$Stage/grok-zh.exe"
          Copy-Item -LiteralPath "install.ps1" -Destination "$Stage/install.ps1"
          Copy-Item -LiteralPath "LICENSE" -Destination "$Stage/LICENSE"
          Copy-Item -LiteralPath "README.md" -Destination "$Stage/README.md"
          Copy-Item -LiteralPath "crates/codegen/xai-grok-shared/i18n/zh-CN.json" -Destination "$Stage/zh-CN.json"
          Copy-Item -LiteralPath "crates/codegen/xai-grok-shared/i18n/schema.json" -Destination "$Stage/schema.json"
          Compress-Archive -Path "$Stage/*" -DestinationPath $env:ASSET -CompressionLevel Optimal
          $Hash = (Get-FileHash -LiteralPath $env:ASSET -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $env:ASSET" | Set-Content -LiteralPath "$env:ASSET.sha256" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-release
          path: |
            grok-zh-x86_64-pc-windows-msvc.zip
            grok-zh-x86_64-pc-windows-msvc.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = "v$env:RELEASE_VERSION"
          $ExistingTag = git ls-remote --tags origin "refs/tags/$Tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect remote tags' }
          if ($ExistingTag) { throw "Release tag $Tag already exists; choose a new version" }
          git tag $Tag HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create release tag' }
          git push origin "refs/tags/$Tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot push release tag' }
          $Notes = $env:RELEASE_NOTES
          if ([string]::IsNullOrWhiteSpace($Notes)) {
            $Notes = "Windows x64 个人汉化构建。上游源码：$(Get-Content SOURCE_REV -Raw)"
          }
          $NotesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $NotesPath -Value $Notes -Encoding utf8
          gh release create $Tag $env:ASSET "$env:ASSET.sha256" --title $Tag --notes-file $NotesPath --verify-tag --latest
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish GitHub Release; existing releases will never be overwritten' }
