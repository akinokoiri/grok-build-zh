name: Propose weekly upstream sync

on:
  schedule:
    - cron: "20 19 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: zh-CN
          fetch-depth: 0
      - name: Merge official main into proposal branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add official https://github.com/xai-org/grok-build.git
          git fetch official main
          git switch --force-create automation/upstream-sync zh-CN
          if git merge --no-edit official/main; then
            if git diff --quiet zh-CN..HEAD; then
              echo "Already synchronized with $(git rev-parse official/main)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git push --force-with-lease origin automation/upstream-sync
            gh pr view automation/upstream-sync --json number >/dev/null 2>&1 || \
              gh pr create \
                --base zh-CN \
                --head automation/upstream-sync \
                --title "chore: sync official upstream" \
                --body "每周上游同步提案。合并前必须通过翻译审计和 Windows x64 编译门禁。"
          else
            merge_status=$?
            conflicts=$(git diff --name-only --diff-filter=U)
            if [[ -n "$conflicts" ]]; then
              {
                echo '## Upstream sync needs manual resolution'
                echo
                echo "Maintenance baseline: $(git rev-parse zh-CN)"
                echo "Official upstream: $(git rev-parse official/main)"
                echo
                echo 'No proposal was pushed and no release was published. Resolve these conflicts locally, then run the translation and Windows gates:'
                echo
                echo '```text'
                echo "$conflicts"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              git merge --abort
              echo '::notice::Upstream changes need manual conflict resolution; see the run summary.'
              exit 0
            fi
            echo '::error::Upstream merge failed without merge conflicts.'
            exit "$merge_status"
          fi
